{% extends "base.html" %}

{% block title %}Add Member{% endblock %}

{% block content %}
<h1 class="mb-4">Add New Member</h1>

<div class="row">
    <div class="col-md-6">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Name: <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Last, First" required>
                <small class="text-muted">Format: Last, First (e.g., "Smith, John")</small>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="email@example.com">
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone:</label>
                <input type="text" class="form-control" id="phone" name="phone" placeholder="(801) 555-1234" oninput="formatPhone(this)">
            </div>
            <div class="mb-3">
                <label for="companionship_id" class="form-label">Companionship:</label>
                <select class="form-select" id="companionship_id" name="companionship_id">
                    <option value="">-- Unassigned --</option>
                    {% for district in districts %}
                        <optgroup label="{{ district.name }}">
                            {% for companionship in district.companionships %}
                                <option value="{{ companionship.id }}">
                                    Companionship {{ companionship.id }}
                                    {% if companionship.members %}
                                    ({% for m in companionship.members[:3] %}{{ m.name.split(',')[0] }}{% if not loop.last %}, {% endif %}{% endfor %}{% if companionship.members|length > 3 %}...{% endif %})
                                    {% else %}
                                    (empty)
                                    {% endif %}
                                </option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
                <small class="text-muted">Optional - you can assign to a companionship later</small>
            </div>
            <button type="submit" class="btn btn-success">Add Member</button>
            <a href="{{ url_for('admin.manage_members') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function formatPhone(input) {
        let value = input.value.replace(/\D/g, '');
        if (value.length >= 6) {
            value = '(' + value.substring(0, 3) + ') ' + value.substring(3, 6) + '-' + value.substring(6, 10);
        } else if (value.length >= 3) {
            value = '(' + value.substring(0, 3) + ') ' + value.substring(3);
        } else if (value.length > 0) {
            value = '(' + value + ')';
        }
        input.value = value;
    }
</script>
{% endblock %}
