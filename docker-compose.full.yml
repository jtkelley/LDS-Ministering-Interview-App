version: '3.8'

# Full version with Chrome/Selenium for LCR scraping
services:
  ministering-app:
    build:
      context: .
      dockerfile: Dockerfile.full
    ports:
      - "80:8181"
    volumes:
      # Mount the instance directory for SQLite database persistence
      - ./instance:/app/instance
    environment:
      # Flask secret key for sessions and database encryption
      - SECRET_KEY=${SECRET_KEY:-dev-local-ministering-interviews-key-not-for-production-use-12345678}
      # Port for gunicorn to bind to
      - PORT=8181
    restart: unless-stopped
    # Note: Email/SMS settings are configured via the app UI, not environment variables
    # They are stored encrypted in the database
